[package]
name = "echec"
version = "0.1.0"
edition = "2021"

[dependencies]
shakmaty = "0.27"
# Accès aux tables de finales Syzygy (même écosystème que shakmaty — lib de
# lecture d'un format de fichiers, pas une dépendance ML).
shakmaty-syzygy = "0.25"
rayon = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"

[[bin]]
name = "distill"
path = "src/bin/distill.rs"

[[bin]]
name = "forensic"
path = "src/bin/forensic.rs"

[[bin]]
name = "greffe"
path = "src/bin/greffe.rs"

[[bin]]
name = "calibration"
path = "src/bin/calibration.rs"

[[bin]]
name = "match"
path = "src/bin/match.rs"

[[bin]]
name = "arbitre"
path = "src/bin/arbitre.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "banc"
path = "src/bin/banc.rs"
